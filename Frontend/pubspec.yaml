name: tme_insight
description: AI-Powered Clinical Decision Support System for Histopathology

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^1.10.25

  # State Management
  flutter_riverpod: ^2.4.0

  # Navigation
  go_router: ^17.3.0

  # HTTP & API
  dio: ^5.3.1

  # UI & Charts
  fl_chart: ^0.65.0
  image_picker: ^1.0.4
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
